[project]
name = "brand-knowledge-document-generator"
version = "0.1.0"
description = "Generate brand knowledge documents from user-provided YAML."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "weasyprint>=62",
    "ollama>=0.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-json-logger>=3.1",
    "httpx2>=2.13.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brand_docs"]

[tool.ruff]
line-length = 100
# "." makes the tests package first-party for import sorting.
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["brand_docs"]

# WeasyPrint ships without type information.
[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
